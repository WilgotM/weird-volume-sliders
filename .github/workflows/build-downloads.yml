name: Build app downloads

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-mac:
    name: Build Mac DMG
    runs-on: macos-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Mac app
        run: npm run dist:mac

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weird-volume-sliders-mac
          path: dist/*.dmg

      - name: Publish Mac release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          body: |
            Download the app for your computer.

            Mac: download the DMG, open it, drag the app to Applications, then open Weird Volume Sliders.
            Windows: download the setup EXE and follow the installer.

            These builds are unsigned, so macOS or Windows may ask you to approve the app the first time.

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app
        run: npm run dist:windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: weird-volume-sliders-windows
          path: dist/*.exe

      - name: Publish Windows release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
